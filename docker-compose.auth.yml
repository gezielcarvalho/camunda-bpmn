# Docker Compose override for enabling Identity/Authentication
# To enable authentication: docker compose -f docker-compose.yml -f docker-compose.auth.yml up -d

services:
  # Enable authentication for Operate
  operate:
    environment:
      - SPRING_PROFILES_ACTIVE=identity-auth
      - CAMUNDA_OPERATE_IDENTITY_ISSUER_URL=http://localhost:8084/auth/realms/camunda-platform
      - CAMUNDA_OPERATE_IDENTITY_ISSUER_BACKEND_URL=http://identity:8080/auth/realms/camunda-platform
      - CAMUNDA_OPERATE_IDENTITY_CLIENT_ID=operate
      - CAMUNDA_OPERATE_IDENTITY_CLIENT_SECRET=${KEYCLOAK_INIT_OPERATE_SECRET}
      - CAMUNDA_OPERATE_IDENTITY_AUDIENCE=operate-api
    depends_on:
      - zeebe
      - elasticsearch
      - identity

  # Enable authentication for Tasklist
  tasklist:
    environment:
      - SPRING_PROFILES_ACTIVE=identity-auth
      - CAMUNDA_TASKLIST_IDENTITY_ISSUER_URL=http://localhost:8084/auth/realms/camunda-platform
      - CAMUNDA_TASKLIST_IDENTITY_ISSUER_BACKEND_URL=http://identity:8080/auth/realms/camunda-platform
      - CAMUNDA_TASKLIST_IDENTITY_CLIENT_ID=tasklist
      - CAMUNDA_TASKLIST_IDENTITY_CLIENT_SECRET=${KEYCLOAK_INIT_TASKLIST_SECRET}
      - CAMUNDA_TASKLIST_IDENTITY_AUDIENCE=tasklist-api
    depends_on:
      - zeebe
      - elasticsearch
      - identity

  # Identity service (Keycloak-based)
  identity:
    image: ${IDENTITY_IMAGE:-camunda/identity:8.6.3}
    container_name: identity
    ports:
      - "8084:8080"
    environment:
      - IDENTITY_AUTH_PROVIDER_BACKEND_URL=http://localhost:18080/auth/realms/camunda-platform
      - IDENTITY_DATABASE_HOST=identity-postgres
      - IDENTITY_DATABASE_PORT=5432
      - IDENTITY_DATABASE_NAME=identity
      - IDENTITY_DATABASE_USERNAME=identity
      - IDENTITY_DATABASE_PASSWORD=identity
      - KEYCLOAK_SETUP_USER=${IDP_ADMIN_USER}
      - KEYCLOAK_SETUP_PASSWORD=${IDP_ADMIN_PASSWORD}
      - KEYCLOAK_SETUP_ROOT_URL=http://localhost:8084
      - KEYCLOAK_CLIENTS_0_NAME=operate
      - KEYCLOAK_CLIENTS_0_ID=operate
      - KEYCLOAK_CLIENTS_0_SECRET=${KEYCLOAK_INIT_OPERATE_SECRET}
      - KEYCLOAK_CLIENTS_0_ROOT_URL=${KEYCLOAK_INIT_OPERATE_ROOT_URL}
      - KEYCLOAK_CLIENTS_0_REDIRECT_URIS_0=${KEYCLOAK_INIT_OPERATE_ROOT_URL}/*
      - KEYCLOAK_CLIENTS_1_NAME=tasklist
      - KEYCLOAK_CLIENTS_1_ID=tasklist
      - KEYCLOAK_CLIENTS_1_SECRET=${KEYCLOAK_INIT_TASKLIST_SECRET}
      - KEYCLOAK_CLIENTS_1_ROOT_URL=${KEYCLOAK_INIT_TASKLIST_ROOT_URL}
      - KEYCLOAK_CLIENTS_1_REDIRECT_URIS_0=${KEYCLOAK_INIT_TASKLIST_ROOT_URL}/*
    depends_on:
      - identity-postgres
    networks:
      - camunda-platform
    restart: unless-stopped

  # Database for Identity service
  identity-postgres:
    image: postgres:15-alpine
    container_name: identity-postgres
    environment:
      - POSTGRES_DB=identity
      - POSTGRES_USER=identity
      - POSTGRES_PASSWORD=identity
    volumes:
      - identity-postgres-data:/var/lib/postgresql/data
    networks:
      - camunda-platform
    restart: unless-stopped

volumes:
  identity-postgres-data:
